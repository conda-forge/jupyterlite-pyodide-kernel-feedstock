# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0b0"
  jupyterlab_min: "4.7.0b0"
  jupyterlab_max: "4.8.0"
  jupyterlite_core_min: "0.9.0b1"
  jupyterlite_core_max: "0.10.0"
  python_min_lock: "3.12"
  python_check_max: "3.15"
  # derived
  js_version: ${{ version | replace("a", "-alpha.") | replace("b", "-beta.") | replace("rc", "-rc.") }}
  # test_validate_config: some fixture issue
  pytest_k: not test_validate_config
  cov_fail_under: "91"

recipe:
  name: jupyterlite-pyodide-kernel-split
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/j/jupyterlite-pyodide-kernel/jupyterlite_pyodide_kernel-${{ version }}.tar.gz
  sha256: 80d7c0b362f532e40011f8c99651f107a68cf4a132a1b2a1c69e5a57755fc423

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: jupyterlite-pyodide-kernel
    build:
      noarch: python
      script:
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
      python:
        entry_points:
          - jupyter-piplite = jupyterlite_pyodide_kernel.app:main
    requirements:
      host:
        - hatchling >=1.28.0
        - jupyter-builder >=1.2.2,<2
        - pip
        - python ${{ python_min }}.*
      run:
        - jupyterlite-core >=${{ jupyterlite_core_min }}
        - pkginfo
        - python >=${{ python_min }}
    tests:
      - package_contents:
          strict: true
          site_packages:
            - jupyterlite_pyodide_kernel/**
            - jupyterlite_pyodide_kernel-${{ version }}.dist-info/**
          files:
            - share/jupyter/labextensions/@jupyterlite/pyodide-kernel-extension/**
      - python:
          imports: jupyterlite_pyodide_kernel
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - requirements:
          run:
            - jupyterlab ${{ jupyterlab_min }}.*
            - jupyterlite-core ${{ jupyterlite_core_min }}.*
            - pip
            - python ${{ python_min }}.*
        script:
          - python -m pip check
          - jupyter piplite --version
          - jupyter-piplite --help
          - jupyter labextension list
          - jupyter labextension list 2>&1 | python -c "import re, sys; assert re.search(r'@jupyterlite/pyodide-kernel-extension.*v${{ js_version | replace(".", "\\.") }}.*OK', sys.stdin.read())"
          - jupyter lite build
          - python -c "from pathlib import Path; assert b'pyodide-kernel-extension' in Path('_output/jupyter-lite.json').read_bytes()"

  - package:
      name: jupyterlite-pyodide-kernel-with-lock
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("jupyterlite-pyodide-kernel", exact=True) }}
        - pyodide-lock-with-uv >=0.1.3,<0.3.0
    tests:
      - python:
          imports: jupyterlite_pyodide_kernel
          pip_check: true
          python_version:
            - ${{ python_min_lock }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - pyproject.toml
        requirements:
          run:
            - pytest-console-scripts
            - pytest-cov <7
            - pytest-html
            - python ${{ python_min_lock }}.*
            - pyyaml
        script:
          - pytest -vv --tb=long --color=yes -k "${{ pytest_k }}" --cov-fail-under=${{ cov_fail_under }}
    about:
      summary: Python kernel for JupyterLite powered by Pyodide (with [lock])

about:
  summary: Python kernel for JupyterLite powered by Pyodide
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - jupyterlite_pyodide_kernel/labextension/static/third-party-licenses.json
  homepage: https://pypi.org/project/jupyterlite-pyodide-kernel
  repository: https://github.com/jupyterlite/pyodide-kernel
  documentation: https://jupyterlite-pyodide-kernel.rtfd.io

extra:
  feedstock-name: jupyterlite-pyodide-kernel
  recipe-maintainers:
    - agriyakhetarpal
    - bollwyvl
    - jtpio
    - martinRenou
